<app-auth-card title="Verifica tu correo" [subtitle]="'Hemos enviado un código de 6 dígitos a ' + email + '.'">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-form-field
      label="Código de verificación"
      autocomplete="one-time-code"
      inputmode="numeric"
      [maxlength]="6"
      [control]="form.controls.code"
    />

    @if (verifyAction.error(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }
    @if (resendAction.error(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }
    @if (info(); as message) {
      <p class="form-info" role="status">{{ message }}</p>
    }

    <button class="btn" type="submit" [disabled]="verifyAction.pending()">
      {{ verifyAction.pending() ? 'Verificando…' : 'Verificar' }}
    </button>
  </form>

  <div class="divider"><span>o</span></div>
  <p class="hint">Si tienes abierta tu cuenta de Google con este correo, verifícate al instante:</p>
  <div #googleButton class="google-button"></div>

  <button class="link-button" type="button" (click)="resend()" [disabled]="resendAction.pending() || cooldown.active()">
    {{ cooldown.active() ? 'Reenviar código (' + cooldown.remaining() + ' s)' : 'Reenviar código' }}
  </button>
  <p class="auth-footer"><a routerLink="/login">Volver al inicio de sesión</a></p>
</app-auth-card>

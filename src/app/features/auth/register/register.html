<app-auth-card title="Crear cuenta" subtitle="Te enviaremos un código para verificar tu correo.">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-form-field label="Correo electrónico" type="email" autocomplete="email" [control]="form.controls.email" />
    <app-form-field label="Contraseña" type="password" autocomplete="new-password" [control]="form.controls.password" />
    <app-form-field label="Repite la contraseña" type="password" autocomplete="new-password" [control]="form.controls.confirm" />

    @if (action.error(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }

    <button class="btn" type="submit" [disabled]="action.pending()">
      {{ action.pending() ? 'Creando cuenta…' : 'Registrarme' }}
    </button>
  </form>
  <p class="auth-footer">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
</app-auth-card>

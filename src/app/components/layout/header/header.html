<div class="header">
  <div class="header__inner">
    <div class="header__left">
      <a class="header__brand" routerLink="/">
        <img class="header__logo" src="/logo.png" alt="" width="34" height="33" />
        <div class="header__name text-heading">
          <div>branbp</div>
          <div class="text-accent">.com</div>
        </div>
      </a>

      <div class="header__nav">
        @for (item of navItems; track item.path) {
          <a class="header__link" [routerLink]="item.path" routerLinkActive="header__link--active">{{ item.label }}</a>
        }
      </div>
    </div>

    <app-user-menu />
  </div>
</div>
<div class="header-spacer"></div>

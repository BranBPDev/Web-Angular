<div class="project-card" [class.project-card--horizontal]="layout() === 'horizontal'">
  <img class="project-card__image" [src]="project().image" [alt]="project().name" draggable="false" loading="lazy" />
  <div class="project-card__body">
    <div class="text-label">{{ kindLabel() }}</div>
    <div class="text-heading text-break" role="heading" aria-level="3">{{ project().name }}</div>
    @if (layout() === 'horizontal') {
      <div class="text-secondary text-break">{{ displayUrl() }}</div>
    }
    <a class="btn btn--auto project-card__action" [href]="project().url" target="_blank" rel="noopener noreferrer">
      {{ actionLabel() }}<app-icon name="external-link" [size]="16" />
    </a>
  </div>
</div>

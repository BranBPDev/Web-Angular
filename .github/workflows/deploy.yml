name: Deploy branbp.com

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'testing/**'
      - 'docs/**'
      - 'database/**'
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular
        run: npx ng build --configuration production --base-href /

      - name: Localizar salida y preparar SPA fallback
        run: |
          OUT=$(dirname "$(find dist -path '*/browser/index.html' | head -n 1)")
          echo "Salida: $OUT"
          cp "$OUT/index.html" "$OUT/404.html"
          echo "OUT_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
